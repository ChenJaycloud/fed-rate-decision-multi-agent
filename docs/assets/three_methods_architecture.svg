<text x="545.0" y="151.0" text-anchor="middle" class="box-title">理论判断层 · 7 个规则智能体</text>
<text x="405.0" y="190.0" text-anchor="start" class="label">标准 / 前瞻 Taylor · 利率平滑</text>
<text x="405.0" y="220.0" text-anchor="start" class="label">平衡方法 · 开放经济 · 金融稳定 · 新凯恩斯最优</text>
<text x="545.0" y="260.0" text-anchor="middle" class="small">分别输出标签分布、依据与关键变量</text>
<path d="M715 202 H760" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="765" y="115" width="285" height="175" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="907.0" y="151.0" text-anchor="middle" class="box-title">分析交接层</text>
<text x="791.0" y="190.0" text-anchor="start" class="label">提炼共识、分歧与风险</text>
<text x="791.0" y="220.0" text-anchor="start" class="label">整理理由和关键变量</text>
<text x="907.0" y="260.0" text-anchor="middle" class="small">形成结构化证据包</text>
<path d="M1050 202 H1095" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1100" y="115" width="300" height="175" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="1250.0" y="151.0" text-anchor="middle" class="box-title">方法化决策层</text>
<text x="1128.0" y="190.0" text-anchor="start" class="label">按各自训练方式综合证据</text>
<text x="1128.0" y="220.0" text-anchor="start" class="label">输出七档利率变动标签</text>
<text x="1250.0" y="260.0" text-anchor="middle" class="small">共享测试集进行并列评价</text>
<text x="720.0" y="340.0" text-anchor="middle" class="box-title">三种训练方式的差异</text>
<rect x="45" y="375" width="430" height="300" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<rect x="45" y="375" width="430" height="58" rx="18" fill="#e2e8f0"/>
<text x="260.0" y="412.0" text-anchor="middle" class="box-title">无训练的理论判断直接汇总</text>
<text x="75.0" y="475.0" text-anchor="start" class="agent">训练期</text>
<text x="160.0" y="475.0" text-anchor="start" class="label">不拟合数值权重，也不形成文字记忆</text>
<text x="75.0" y="520.0" text-anchor="start" class="agent">测试期</text>
<text x="160.0" y="520.0" text-anchor="start" class="label">按预设聚合逻辑综合理论判断</text>
<line x1="75" y1="552" x2="445" y2="552" stroke="#e2e8f0"/>
<text x="260.0" y="590.0" text-anchor="middle" class="small">提供不依赖训练经验的参照</text>
<text x="260.0" y="630.0" text-anchor="middle" class="agent">结果：50.6% 七分类准确率</text>
<rect x="505" y="375" width="430" height="300" rx="18" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
<rect x="505" y="375" width="430" height="58" rx="18" fill="#dbeafe"/>
<text x="720.0" y="412.0" text-anchor="middle" class="box-title">训练集数值权重</text>
<text x="535.0" y="475.0" text-anchor="start" class="agent">训练期</text>
<text x="620.0" y="475.0" text-anchor="start" class="label">根据理论输出的标签支持度形成权重</text>
<text x="535.0" y="520.0" text-anchor="start" class="agent">测试期</text>
<text x="620.0" y="520.0" text-anchor="start" class="label">读取冻结权重，不用测试标签更新</text>
<line x1="535" y1="552" x2="905" y2="552" stroke="#e2e8f0"/>
<text x="720.0" y="590.0" text-anchor="middle" class="small">显式表示训练期理论支持差异</text>
<text x="720.0" y="630.0" text-anchor="middle" class="agent">结果：51.8% 七分类准确率</text>
<rect x="965" y="375" width="430" height="300" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<rect x="965" y="375" width="430" height="58" rx="18" fill="#dcfce7"/>
<text x="1180.0" y="412.0" text-anchor="middle" class="box-title">训练集文字反思记忆</text>
<text x="995.0" y="475.0" text-anchor="start" class="agent">训练期</text>
<text x="1080.0" y="475.0" text-anchor="start" class="label">复盘预测案例，归纳适用条件与误判</text>
<text x="995.0" y="520.0" text-anchor="start" class="agent">测试期</text>
<text x="1080.0" y="520.0" text-anchor="start" class="label">读取冻结记忆，不用测试标签更新</text>
<line x1="995" y1="552" x2="1365" y2="552" stroke="#e2e8f0"/>
<text x="1180.0" y="590.0" text-anchor="middle" class="small">以结构化经验辅助决策层判断</text>
<text x="1180.0" y="630.0" text-anchor="middle" class="agent">结果：75.9% 七分类准确率</text>
<rect x="45" y="720" width="1350" height="185" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="720.0" y="761.0" text-anchor="middle" class="box-title">共同评价设置</text>
<text x="90.0" y="810.0" text-anchor="start" class="agent">测试区间：2015—2025</text>
<text x="450.0" y="810.0" text-anchor="start" class="agent">测试样本：83 个会议月份</text>
<text x="855.0" y="810.0" text-anchor="start" class="agent">多数类基准：62.7%（52/83）</text>
<text x="720.0" y="858.0" text-anchor="middle" class="small">保存的历史运行结果；不是当前公开仓库重新运行所得，也不是严格实时回测。</text>
</svg>