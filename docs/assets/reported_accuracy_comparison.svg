<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-label="研究稿报告的历史对照准确率">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#64748b}.label{font-size:15px}.small{font-size:13px}.box-title{font-size:18px;font-weight:700}.agent{font-size:14px;font-weight:600}</style>
<rect width="100%" height="100%" rx="20" fill="#f8fafc"/>
<text x="560" y="46" text-anchor="middle" class="title">三种训练经验处理设定：七分类准确率</text>
<text x="560" y="74" text-anchor="middle" class="sub">研究草稿报告值；A/B 对照实现不在当前公开代码包中</text>
<line x1="360.0" y1="135" x2="360.0" y2="410" stroke="#e2e8f0"/>
<text x="360.0" y="434" text-anchor="middle" class="small">0%</text>
<line x1="522.5" y1="135" x2="522.5" y2="410" stroke="#e2e8f0"/>
<text x="522.5" y="434" text-anchor="middle" class="small">25%</text>
<line x1="685.0" y1="135" x2="685.0" y2="410" stroke="#e2e8f0"/>
<text x="685.0" y="434" text-anchor="middle" class="small">50%</text>
<line x1="847.5" y1="135" x2="847.5" y2="410" stroke="#e2e8f0"/>
<text x="847.5" y="434" text-anchor="middle" class="small">75%</text>
<line x1="1010.0" y1="135" x2="1010.0" y2="410" stroke="#e2e8f0"/>
<text x="1010.0" y="434" text-anchor="middle" class="small">100%</text>
<line x1="767.5" y1="127" x2="767.5" y2="410" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
<text x="774.5" y="120" class="small">多数类基准 62.7%</text>
<text x="342" y="199" text-anchor="end" class="label">无训练直接聚合</text>
<rect x="360" y="177" width="328.9" height="38" rx="10" fill="#94a3b8"/>
<text x="700.9" y="202" class="agent">50.6%</text>
<text x="342" y="281" text-anchor="end" class="label">训练集数值权重</text>
<rect x="360" y="259" width="336.7" height="38" rx="10" fill="#60a5fa"/>
<text x="708.7" y="284" class="agent">51.8%</text>
<text x="342" y="363" text-anchor="end" class="label">训练期反思记忆</text>
<rect x="360" y="341" width="493.4" height="38" rx="10" fill="#16a34a"/>
<text x="865.4" y="366" class="agent">75.9%</text>
<text x="560" y="497" text-anchor="middle" class="small">样本数均为 83；结果来自研究稿记录，不代表可由当前公开仓库直接复现。</text>
</svg>